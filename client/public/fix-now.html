<!DOCTYPE html>
<html>
<head>
  <title>Force Fix LeetCode Data</title>
  <style>
    body {
      font-family: system-ui;
      background: #000;
      color: #0f0;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    .box {
      background: #111;
      border: 2px solid #0f0;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin: 10px;
    }
    button:hover { background: #0cf; }
    .success { color: #0f0; }
    .error { color: #f00; }
    pre {
      background: #000;
      padding: 15px;
      border-left: 3px solid #0f0;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🔧 Force Fix LeetCode Data</h1>
  
  <div class="box">
    <h2>Step 1: Fetch & Save Real Data</h2>
    <button onclick="fetchAndSave()" style="font-size: 20px;">
      ⚡ FETCH & SAVE NOW
    </button>
    <div id="result"></div>
  </div>
  
  <div class="box">
    <h2>Step 2: Verify Data</h2>
    <button onclick="verifyData()">✓ Verify localStorage</button>
    <div id="verify"></div>
  </div>
  
  <div class="box">
    <h2>Step 3: Go to Page</h2>
    <button onclick="window.location.href='/leetcode'">→ LeetCode Page</button>
    <button onclick="window.location.href='/admin'">→ Admin Dashboard</button>
  </div>
  
  <script>
    async function fetchAndSave() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>⏳ Fetching from alfa-leetcode-api...</p>';
      
      try {
        const response = await fetch('https://alfa-leetcode-api.onrender.com/suryansh07102004/solved');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const solved = await response.json();
        console.log('✅ API Response:', solved);
        
        // Create the exact data structure the app expects
        const leetcodeData = {
          username: 'suryansh07102004',
          name: 'suryansh07102004',
          avatar: null,
          ranking: null,
          reputation: null,
          aboutMe: null,
          country: null,
          totalSolved: solved.solvedProblem || 0,
          easySolved: solved.easySolved || 0,
          mediumSolved: solved.mediumSolved || 0,
          hardSolved: solved.hardSolved || 0,
          totalEasyQ: 874,
          totalMediumQ: 1831,
          totalHardQ: 808,
          streak: 0,
          totalActiveDays: 0,
          submissionCalendar: null
        };
        
        // Also create admin dashboard data
        const lcStatsData = {
          username: 'suryansh07102004',
          totalSolved: solved.solvedProblem || 0,
          easySolved: solved.easySolved || 0,
          mediumSolved: solved.mediumSolved || 0,
          hardSolved: solved.hardSolved || 0,
          ranking: null,
          reputation: null,
          totalActiveDays: 0
        };
        
        // Save to localStorage
        localStorage.setItem('leetcode_cached', JSON.stringify(leetcodeData));
        localStorage.setItem('leetcode_lastFetch', Date.now().toString());
        localStorage.setItem('lcStats_cached', JSON.stringify(lcStatsData));
        localStorage.setItem('lcStats_lastFetch', Date.now().toString());
        
        resultDiv.innerHTML = `
          <p class="success">✅ SUCCESS! Data saved to localStorage</p>
          <pre>${JSON.stringify(leetcodeData, null, 2)}</pre>
          <p class="success">Now click "→ LeetCode Page" or "→ Admin Dashboard" to see your stats!</p>
        `;
        
      } catch (error) {
        resultDiv.innerHTML = `
          <p class="error">❌ Error: ${error.message}</p>
          <p>Trying to fetch anyway in case of CORS issue...</p>
        `;
        
        // Fallback: just set the data manually based on what we know
        const manualData = {
          username: 'suryansh07102004',
          name: 'suryansh07102004',
          avatar: null,
          ranking: null,
          reputation: null,
          aboutMe: null,
          country: null,
          totalSolved: 283,
          easySolved: 127,
          mediumSolved: 140,
          hardSolved: 16,
          totalEasyQ: 874,
          totalMediumQ: 1831,
          totalHardQ: 808,
          streak: 0,
          totalActiveDays: 0,
          submissionCalendar: null
        };
        
        const manualLcStats = {
          username: 'suryansh07102004',
          totalSolved: 283,
          easySolved: 127,
          mediumSolved: 140,
          hardSolved: 16,
          ranking: null,
          reputation: null,
          totalActiveDays: 0
        };
        
        localStorage.setItem('leetcode_cached', JSON.stringify(manualData));
        localStorage.setItem('leetcode_lastFetch', Date.now().toString());
        localStorage.setItem('lcStats_cached', JSON.stringify(manualLcStats));
        localStorage.setItem('lcStats_lastFetch', Date.now().toString());
        
        resultDiv.innerHTML += `
          <p class="success">✅ Saved manual data as fallback!</p>
          <pre>${JSON.stringify(manualData, null, 2)}</pre>
        `;
      }
    }
    
    function verifyData() {
      const verifyDiv = document.getElementById('verify');
      const leetcode = localStorage.getItem('leetcode_cached');
      const lcStats = localStorage.getItem('lcStats_cached');
      
      let html = '<h3>Current localStorage:</h3>';
      
      if (leetcode) {
        const data = JSON.parse(leetcode);
        html += `<p class="success">✓ leetcode_cached exists</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
      } else {
        html += '<p class="error">✗ leetcode_cached NOT found</p>';
      }
      
      if (lcStats) {
        const data = JSON.parse(lcStats);
        html += `<p class="success">✓ lcStats_cached exists</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
      } else {
        html += '<p class="error">✗ lcStats_cached NOT found</p>';
      }
      
      verifyDiv.innerHTML = html;
    }
  </script>
</body>
</html>
