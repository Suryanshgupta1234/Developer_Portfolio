<!DOCTYPE html>
<html>
<head>
  <title>LeetCode API Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    .stat {
      padding: 15px;
      margin: 10px 0;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      border-left: 4px solid #22c55e;
    }
    .loading { border-left-color: #f59e0b; }
    .error { border-left-color: #ef4444; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 20px;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>🧪 LeetCode API Direct Test</h1>
  <p>Testing API for: <strong>suryansh07102004</strong></p>
  <div id="result"><div class="stat loading">⏳ Loading...</div></div>
  <button onclick="testAPI()">🔄 Test Again</button>
  <button onclick="window.location.href='/admin'">← Back to Admin</button>
  
  <script>
    const USERNAME = 'suryansh07102004';
    
    async function testAPI() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<div class="stat loading">⏳ Testing LeetCode GraphQL API...</div>';
      
      const query = {
        query: `
          query getUserProfile($username: String!) {
            matchedUser(username: $username) {
              username
              submitStats: submitStatsGlobal {
                acSubmissionNum {
                  difficulty
                  count
                }
              }
            }
          }
        `,
        variables: { username: USERNAME }
      };
      
      try {
        console.log('Fetching from LeetCode API...');
        const response = await fetch('https://leetcode.com/graphql', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Referer': 'https://leetcode.com'
          },
          body: JSON.stringify(query)
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        console.log('API Response:', data);
        
        if (data.errors) {
          throw new Error(data.errors[0].message);
        }
        
        const stats = data.data.matchedUser.submitStats.acSubmissionNum;
        const easy = stats.find(s => s.difficulty === 'Easy')?.count ?? 0;
        const medium = stats.find(s => s.difficulty === 'Medium')?.count ?? 0;
        const hard = stats.find(s => s.difficulty === 'Hard')?.count ?? 0;
        const total = stats.find(s => s.difficulty === 'All')?.count ?? 0;
        
        resultDiv.innerHTML = `
          <div class="stat">✅ API Response Successful!</div>
          <div class="stat">📧 Username: ${data.data.matchedUser.username}</div>
          <div class="stat">🟢 Easy: ${easy}</div>
          <div class="stat">🟡 Medium: ${medium}</div>
          <div class="stat">🔴 Hard: ${hard}</div>
          <div class="stat">📊 Total: ${total}</div>
          <div class="stat" style="margin-top: 20px; font-size: 12px; opacity: 0.5;">
            ✓ Direct GraphQL API working<br>
            ✓ localStorage available: ${localStorage ? 'Yes' : 'No'}
          </div>
        `;
        
        // Store in localStorage
        localStorage.setItem('lcStats_cached', JSON.stringify({
          easySolved: easy,
          mediumSolved: medium,
          hardSolved: hard,
          totalSolved: total
        }));
        localStorage.setItem('lcStats_lastFetch', Date.now().toString());
        console.log('✅ Saved to localStorage');
        
      } catch (error) {
        console.error('API Error:', error);
        resultDiv.innerHTML = `
          <div class="stat error">❌ Error: ${error.message}</div>
          <div class="stat error">This might be a CORS issue. The admin dashboard should handle this with a proxy.</div>
        `;
      }
    }
    
    // Auto-run on page load
    testAPI();
  </script>
</body>
</html>
